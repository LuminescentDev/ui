packages:
  - packages/*

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@parcel/watcher@2.5.6'
  - esbuild
  - esbuild@0.28.1
  - nx
  - sharp
  - sharp@0.34.5
  - workerd
  - workerd@1.20260708.1

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0

overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

blockExoticSubdeps: false

minimumReleaseAge: 0

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  nx: true
  sharp: set this to true or false
  workerd: true
