packages:
  - packages/*

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@parcel/watcher@2.5.6'
  - esbuild
  - esbuild@0.28.1
  - nx
  - sharp
  - sharp@0.34.5
  - workerd
  - workerd@1.20260708.1

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0

overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

blockExoticSubdeps: false

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260714.1'
  - '@voidzero-dev/vite-plus-core@1.0.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.0.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.0.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.0.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0'
  - vite-plus@1.0.0

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  nx: true
  sharp: set this to true or false
  workerd: true
